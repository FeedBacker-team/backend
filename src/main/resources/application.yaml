spring:
  application:
    name: feedbacker

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/feedbacker}
    username: ${DB_USERNAME:feedbacker}
    password: ${DB_PASSWORD:feedbacker_local_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
      jdbc:
        time_zone: UTC

server:
  port: ${PORT:8080}

supabase:
  url: ${SUPABASE_URL:}
  storage:
    secret-key: ${SUPABASE_SECRET_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:}

# JWT 설정 (Access Token: 1시간, Refresh Token: 14일)
jwt:
  secret: c3dpcC1mZWVkYmFja2VyLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1hdXRoZW50aWNhdGlvbi0yMDI2
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

# 카카오 OAuth 2.0 설정
kakao:
  client-id: ${KAKAO_CLIENT_ID:your_kakao_rest_api_key}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/oauth/callback/kakao}